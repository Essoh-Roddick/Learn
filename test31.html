
<!DOCTYPE html>
<html>
    <head lang="en">
        <title>Counter</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles31.css">

    </head>

    <body>
       <a href="index.html"><button>Back</button></a> 
        <h2>A couter with reset and save</h2>
        <p>The counter will be able to </p>
        <ul>
            <li><b>Increase </b> count</li>
            <li><b>Reduce</b> count</li>
            <li><b>Reset</b> count</li>
            <li><b>Save</b> count</li>
            <li><b>Load</b> count</li>

            <div id="cntb">
                <div id="count" style="font-size: 60px;">0</div>
                <p>
                    <button onclick="increase()"><b>+</b></button>
                    <button onclick="decrease()"><b>-</b></button>
                    <button onclick="reset()"><b>Reset</b></button>
                    <button onclick="save()"><b>Save</b></button>
                    <button onclick="load()"><b>Load</b></button>
                </p>
            </div>
        </ul>
        
        <script src="script31.js"></script>
    </body>
</html>
